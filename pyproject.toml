[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opgg-cli"
version = "0.1.0"
description = "Command-line client for OP.GG esports data (League of Legends, TFT, Valorant) via the OP.GG MCP endpoint"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "OstrichHermit" }]
requires-python = ">=3.10"
keywords = ["opgg", "op.gg", "league-of-legends", "tft", "valorant", "cli", "esports", "mcp"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/OstrichHermit/opgg-cli"
Issues = "https://github.com/OstrichHermit/opgg-cli/issues"

[project.scripts]
opgg = "opgg_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
